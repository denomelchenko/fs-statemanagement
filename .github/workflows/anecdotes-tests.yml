name: Anecdotes tests

on:
  push:
    branches: [main]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm through Corepack
        run: corepack prepare pnpm@12.5.1 --activate

      - name: Install anecdotes dependencies
        working-directory: anecdotes
        run: corepack pnpm install --frozen-lockfile

      - name: Install test dependencies
        working-directory: anecdotes-tests
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: anecdotes-tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: anecdotes-tests
        run: corepack pnpm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: anecdotes-tests/playwright-report/
          retention-days: 14
